name: macOS (manual)

# Manual only. This workflow lives on the GitHub mirror of gitlab.com/ndmspc/ndmspc, which
# receives the same commits; there is deliberately no push/pull_request trigger, so a mirror
# update never starts a run and nothing is spent until someone asks for it.
#
# The file must exist on the mirror's default branch for GitHub to offer the "Run workflow"
# button at all, even when another branch is selected in "Use workflow from" (that dropdown
# decides which code is built). The mirror's default branch is develop for exactly this reason.
#
# Why macOS runs here and not in GitLab CI: GitLab's hosted macOS runners are beta and are
# not available to open-source projects, and a self-hosted macOS runner needs real Mac
# hardware. GitHub's standard macOS arm64 runners are free for public repositories, and
# ndmspc/ndmspc is a public mirror.
#
# ROOT comes from Homebrew, not from a root.cern tarball. A prebuilt tarball bakes in
# etc/cling/std_darwin.modulemap generated from the SDK of the machine that built it, and cling
# forces that modulemap onto whatever SDK is present at run time
# (CIFactory, AllowModulemapOverride=false). When the two disagree the `std` module cannot be
# built, and every macro dies with "header '__locale_dir/support/liblibc.h' not found"
# followed by an _LIBCPP_ABI_VERSION warning and a segfault or OOM. That is not hypothetical:
# the first two runs of this workflow failed exactly this way, on
# macos-15 and macos-26 alike, because root.cern builds against a newer SDK than the runner
# image carries. Homebrew bottles are built per macOS release, so the modulemap matches the
# runner by construction. See docs/develop/index.md for the full analysis.

on:
  workflow_dispatch:
    inputs:
      run_tutorials:
        description: Run ndmspc-tutorials (build + write every tutorial output)
        type: boolean
        default: true
      run_tests:
        description: Run the ctest suite (make test)
        type: boolean
        default: true
      test_filter:
        description: ctest -R filter for run_tests (empty runs everything)
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS release ndmspc users report against. Keep this one green: it is the gate.
          - name: sequoia
            runs-on: macos-15
            experimental: false
          # Newer macOS: early warning about a Homebrew/ROOT change. Informational, never a
          # gate — a runner image update must not turn the branch red on its own.
          - name: tahoe
            runs-on: macos-26
            experimental: true
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # cmake/version.cmake runs `git describe --tags --long`, which needs the tags.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          # Homebrew's ROOT ships the matching std_darwin.modulemap for this macOS, which is the
          # whole point (see the header comment). ninja only speeds the build up.
          # googletest is not optional here: CMakeLists.txt only builds the tests when GTest is
          # found, and `make.sh test` then fails in ctest with "No tests were found".
          # openssl: `root` depends on openssl@4 on current Homebrew, so install both and let
          # FindOpenSSL pick the newest; pinning only openssl@3 is what broke the first runs.
          brew install root zeromq openssl@3 openssl@4 googletest ninja

      - name: Show what ROOT we got
        run: |
          brew list --versions root
          root-config --version
          # The SDK this runner has; when a failure looks like the modulemap skew above, this is
          # the first thing to compare against the ROOT build.
          sw_vers
          xcode-select -p
          xcrun --show-sdk-path

      - name: Verify ROOT works before building ndmspc
        run: |
          # find_package(Root) has no version gate (cmake/modules/FindRoot.cmake only prints it),
          # so state the version: it is the only record of what was really tested.
          root --version
          # A broken C++ interpreter must fail now, not 40 minutes into the build. This compiles
          # <new>/<string>, i.e. the libc++ `std` module whose modulemap skew breaks every macro.
          #
          # NOT `root -e 'printf(...)'`: ROOT uses the expression's value as its exit status, so a
          # printf returns the character count and fails the step on a healthy interpreter (a
          # 15-character printf exits 15 — which is exactly how the first two runs went red). A
          # macro file reports its own status, and gSystem->Exit() sets an explicit one. ROOT calls
          # the function the file is named after, so keep the two in step.
          cat > "$RUNNER_TEMP/macro_smoke.C" <<'EOF'
          #include <new>
          #include <string>
          #include <iostream>
          void macro_smoke()
          {
            std::string s("ndmspc-macos");
            if (s.size() != 12) { std::cerr << "unexpected std::string size\n"; gSystem->Exit(2); }
            std::cout << "cling-smoke-ok " << gROOT->GetVersionInt() << std::endl;
          }
          EOF
          root -l -b -q "$RUNNER_TEMP/macro_smoke.C"

      - name: Configure and build
        run: |
          export CC=clang CXX=clang++
          # openssl@3 is keg-only, so it has to be pointed at explicitly. Prefer the newest keg
          # Homebrew actually has: `root` pulls openssl@4, and a hard-coded openssl@3 leaves
          # OPENSSL_ROOT_DIR pointing at a keg that may not exist.
          for f in openssl@4 openssl@3 openssl; do
            if p=$(brew --prefix "$f" 2>/dev/null) && [ -d "$p" ]; then
              export OPENSSL_ROOT_DIR="$p"
              echo "OPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR (from $f)"
              break
            fi
          done
          export MY_MAKE_JOBS="$(sysctl -n hw.ncpu)"
          # The AI code is not exercised by the tutorials or the tests.
          export WITH_AI=false
          # `test` builds and runs the whole ctest suite; `testlist=<terms>` narrows it with
          # ctest -R (comma-separated, matched as substrings, which is what make.sh does).
          if [ '${{ inputs.run_tests }}' != 'true' ]; then
            set -- install jobs="$MY_MAKE_JOBS"
          elif [ -n '${{ inputs.test_filter }}' ]; then
            set -- install testlist='${{ inputs.test_filter }}' jobs="$MY_MAKE_JOBS"
          else
            set -- install test jobs="$MY_MAKE_JOBS"
          fi

          # Publish the failure reason in the Annotations panel, which anyone can read without
          # logging in — the job log and the artifacts need an authenticated token. A failing
          # configure otherwise reduces to a bare "exit code 1" that has to be re-run to diagnose.
          announce() {
            echo "::error title=$1::$2"
          }
          set +e
          ./scripts/make.sh "$@" 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Three different failures reach this point and each needs its own extraction:
            #   1. CMake configure  -> "CMake Error"
            #   2. compile/link     -> "error:" / "Error 1"
            #   3. ctest            -> exit 8, and the only useful line is the failed-test summary
            # Reporting only the first pattern buried ctest results under passing test output.
            block=$(awk '/^CMake Error/{f=1} f{print} f&&/^$/{c++} c>=2{exit}' "$RUNNER_TEMP/build.log")
            if [ -z "$block" ]; then
              block=$(grep -E '^The following tests FAILED' -A 40 "$RUNNER_TEMP/build.log" | head -40)
            fi
            if [ -z "$block" ]; then
              block=$(grep -E 'tests failed out of|Errors while running CTest' "$RUNNER_TEMP/build.log" | head -5)
            fi
            if [ -z "$block" ]; then
              block=$(grep -m1 -B2 -A12 -E "error:|Error [0-9]" "$RUNNER_TEMP/build.log")
            fi
            [ -z "$block" ] && block="no CMake/compile/ctest error block found"
            # Annotations are single-line, so flatten the block into one message.
            announce "make.sh failed (exit $status)" "$(printf '%s' "$block" | tr '\n' '|' | cut -c1-1500)"
            echo "=== last 80 lines ==="
            tail -n 80 "$RUNNER_TEMP/build.log"
            exit "$status"
          fi

      # A failing configure is the one failure this job cannot diagnose by itself: the log lives
      # in build/CMakeFiles/*.log, the collected artifact is all but empty, and the step exits
      # before producing anything readable. Printing the CMake state on failure costs nothing and
      # saves a whole round trip.
      - name: Explain a configure failure
        if: failure()
        run: |
          echo "=== cmake / toolchain ==="
          cmake --version | head -1
          clang --version | head -1
          echo "=== Homebrew prefixes ==="
          for f in root zeromq openssl@3 openssl@4 googletest; do
            printf '%-12s %s\n' "$f" "$(brew --prefix "$f" 2>/dev/null || echo '(not installed)')"
          done
          echo "=== ROOT as CMake sees it ==="
          root-config --version || true
          root-config --libdir || true
          echo "=== ctest failures ==="
          # ctest writes the failing test names here; the console summary scrolls away.
          for f in build/Testing/Temporary/LastTestsFailed.log; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done
          [ -f build/Testing/Temporary/LastTest.log ] && {
            echo "--- LastTest.log (failed sections) ---"
            grep -E "^[0-9]+/[0-9]+ Test|Test Failed|\*\*\*Failed|Errors while" \
              build/Testing/Temporary/LastTest.log | tail -40
          }
          echo "=== CMake error output ==="
          for f in build/CMakeFiles/CMakeConfigureLog.yaml build/CMakeFiles/CMakeOutput.log \
                   build/CMakeFiles/CMakeError.log; do
            [ -f "$f" ] && { echo "--- $f (tail) ---"; tail -n 60 "$f"; }
          done
          for f in build/CMakeCache.txt; do
            [ -f "$f" ] && { echo "--- $f (relevant) ---"; grep -iE 'openssl|zeromq|root_|gtest|googletest' "$f" | head -40; }
          done

      - name: Run the tutorials
        if: inputs.run_tutorials
        run: |
          # Installs into the checkout root, so the macros and tutorial/ resolve from here.
          source ./etc/profile.d/ndmspc.sh
          export NDMSPC_DIR="$PWD"
          # macOS resolves installed libraries through DYLD_LIBRARY_PATH; LD_LIBRARY_PATH (set by
          # scripts/env.sh) is ignored there, and the tutorials link against the freshly built libs.
          export DYLD_LIBRARY_PATH="$PWD/lib:$PWD/lib64:$DYLD_LIBRARY_PATH"
          echo "NDMSPC_ROOT=$NDMSPC_ROOT"
          echo "ROOT_INCLUDE_PATH=$ROOT_INCLUDE_PATH"
          echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH"
          mkdir -p "$RUNNER_TEMP/tutorials"
          cd "$RUNNER_TEMP/tutorials"
          # Writes every tutorial output here and exits non-zero listing the failed steps: the same
          # report a macOS user gets. Announce the failed steps, because the step output is only
          # visible with an authenticated token.
          set +e
          ndmspc-tutorials 2>&1 | tee "$RUNNER_TEMP/tutorials.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^  (tutorial|macros)/' "$RUNNER_TEMP/tutorials.log" | head -20 | tr '\n' '|')
            [ -z "$failed" ] && failed="no failed-step lines found"
            echo "::error title=ndmspc-tutorials failed (exit $status)::$failed"
          fi
          exit "$status"

      - name: Collect logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/tutorials
            ${{ runner.temp }}/tutorials.log
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/Testing/Temporary
          if-no-files-found: ignore
