name: macOS (manual)

# Manual only. This workflow lives on the GitHub mirror of gitlab.com/ndmspc/ndmspc, which
# receives the same commits; there is deliberately no push/pull_request trigger, so a mirror
# update never starts a run and nothing is spent until someone asks for it.
#
# The file must exist on the mirror's default branch for GitHub to offer the "Run workflow"
# button at all, even when another branch is selected in "Use workflow from" (that dropdown
# decides which code is built). The mirror's default branch is develop for exactly this reason.
#
# Why macOS runs here and not in GitLab CI: GitLab's hosted macOS runners are beta and are
# not available to open-source projects, and a self-hosted macOS runner needs real Mac
# hardware. GitHub's standard macOS arm64 runners are free for public repositories, and
# ndmspc/ndmspc is a public mirror.
#
# ROOT comes from Homebrew, not from a root.cern tarball. A prebuilt tarball bakes in
# etc/cling/std_darwin.modulemap generated from the SDK of the machine that built it, and cling
# forces that modulemap onto whatever SDK is present at run time
# (CIFactory, AllowModulemapOverride=false). When the two disagree the `std` module cannot be
# built, and every macro dies with "header '__locale_dir/support/liblibc.h' not found"
# followed by an _LIBCPP_ABI_VERSION warning and a segfault or OOM. That is not hypothetical:
# the first two runs of this workflow failed exactly this way, on
# macos-15 and macos-26 alike, because root.cern builds against a newer SDK than the runner
# image carries. Homebrew bottles are built per macOS release, so the modulemap matches the
# runner by construction. See docs/develop/index.md for the full analysis.

on:
  workflow_dispatch:
    inputs:
      run_tutorials:
        description: Run ndmspc-tutorials (build + write every tutorial output)
        type: boolean
        default: true
      run_tests:
        description: Run the ctest suite (make test)
        type: boolean
        default: true
      test_filter:
        description: ctest -R filter for run_tests (empty runs everything)
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS release ndmspc users report against. Keep this one green: it is the gate.
          - name: sequoia
            runs-on: macos-15
            experimental: false
          # Newer macOS: early warning about a Homebrew/ROOT change. Informational, never a
          # gate — a runner image update must not turn the branch red on its own.
          - name: tahoe
            runs-on: macos-26
            experimental: true
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # cmake/version.cmake runs `git describe --tags --long`, which needs the tags.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          # Homebrew's ROOT ships the matching std_darwin.modulemap for this macOS, which is the
          # whole point (see the header comment). ninja only speeds the build up.
          brew install root zeromq openssl@3 ninja

      - name: Show what ROOT we got
        run: |
          brew list --versions root
          root-config --version
          # The SDK this runner has; when a failure looks like the modulemap skew above, this is
          # the first thing to compare against the ROOT build.
          sw_vers
          xcode-select -p
          xcrun --show-sdk-path

      - name: Verify ROOT works before building ndmspc
        run: |
          # find_package(Root) has no version gate (cmake/modules/FindRoot.cmake only prints it),
          # so state the version: it is the only record of what was really tested.
          root --version
          # A broken C++ interpreter must fail now, not 40 minutes into the build. This is the
          # failure signature users report (missing modulemap header, warning, then a crash).
          root -l -b -q -e 'printf("cling-ok %d\n", gROOT->GetVersionInt());'

      - name: Configure and build
        run: |
          export CC=clang CXX=clang++
          # openssl@3 is keg-only, so it has to be pointed at explicitly.
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export MY_MAKE_JOBS="$(sysctl -n hw.ncpu)"
          # The AI code is not exercised by the tutorials or the tests.
          export WITH_AI=false
          # `test` builds and runs the whole ctest suite; `testlist=<terms>` narrows it with
          # ctest -R (comma-separated, matched as substrings, which is what make.sh does).
          if [ '${{ inputs.run_tests }}' != 'true' ]; then
            ./scripts/make.sh install jobs="$MY_MAKE_JOBS"
          elif [ -n '${{ inputs.test_filter }}' ]; then
            ./scripts/make.sh install testlist='${{ inputs.test_filter }}' jobs="$MY_MAKE_JOBS"
          else
            ./scripts/make.sh install test jobs="$MY_MAKE_JOBS"
          fi

      - name: Run the tutorials
        if: inputs.run_tutorials
        run: |
          # Installs into the checkout root, so the macros and tutorial/ resolve from here.
          source ./etc/profile.d/ndmspc.sh
          export NDMSPC_DIR="$PWD"
          export DYLD_LIBRARY_PATH="$PWD/lib:$PWD/lib64:$DYLD_LIBRARY_PATH"
          mkdir -p "$RUNNER_TEMP/tutorials"
          cd "$RUNNER_TEMP/tutorials"
          # Writes every tutorial output here and exits non-zero listing the failed steps:
          # the same report the macOS user got.
          ndmspc-tutorials

      - name: Collect logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/tutorials
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/Testing/Temporary
          if-no-files-found: ignore
