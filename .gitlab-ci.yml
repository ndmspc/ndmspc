# One pipeline per push. A branch with an open merge request would otherwise get
# two: a branch pipeline (push event) and a merge-request pipeline, because the
# catch-all `- when: on_success` in build-al9/build-al10 also matches
# merge_request_event. The branch pipeline is the merge gate here (see the note
# above build-al9), so merge-request pipelines are switched off entirely. Tags
# must stay allowed: they publish the base/slurmd/prod images.
#
# Only feature branches and `develop` get a pipeline. `main` and the
# `v<version>-patch` maintenance branches (v1.4-patch, ...) just receive merges
# that already passed in their source branch pipeline, and the published
# artifacts are built from `develop` (pages) or from tags, so running a pipeline
# there would only repeat work.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^v.*-patch$/
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - deploy
  - deploy-slurm
  - deploy-full

image: quay.io/podman/stable
variables:
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker
  DOCKER_DRIVER: overlay2
  PODMAN_BUILD_OPTS: "--memory 2g --cpu-period 100000 --cpu-quota 200000 --squash"
  MY_MAKE_JOBS: "2"
  # Full clone: cmake/version.cmake runs `git describe --tags`, which needs the tags
  # reachable from the checkout (the default shallow clone has none for old commits).
  GIT_DEPTH: "0"

# These builds are the merge gate on feature branches. On `develop` a merge only
# lands once the branch pipeline has already passed, so they would only repeat
# that work: they are left manual there, and optional, so the pipeline still
# reaches the deploy stage and `pages` runs without anyone having to click them.
# Tags only publish artifacts, so they never run.
build-al9:
  image: $CI_REGISTRY/ndmspc/user/al9:dep
  stage: build
  tags:
    - ndmspc-hosted
  script:
    - WITH_AI=false scripts/make.sh release test numcal
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: "$CI_COMMIT_BRANCH == 'develop'"
      when: manual
      allow_failure: true
    - when: on_success

build-al10:
  image: $CI_REGISTRY/ndmspc/user/al10:dep
  stage: build
  tags:
    - ndmspc-hosted
  script:
    - scripts/make.sh release test
  allow_failure: true
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: "$CI_COMMIT_BRANCH == 'develop'"
      when: manual
    - when: on_success

base-image-test:
  stage: build
  tags:
    - images
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - scripts/write-version.sh
    - podman build $PODMAN_BUILD_OPTS -f ci/Dockerfile.base .
  allow_failure: true
  when: manual
  except:
    - tags
    - develop

build-rpm-copr:
  stage: deploy
  tags:
    - ndmspc-hosted
  image:
    name: $CI_REGISTRY/ndmspc/user/al10:dep
  script:
    - export COPR_LOGIN COPR_TOKEN COPR_USER
    - scripts/copr.sh $COPR_DEBUG
    - scripts/make.sh rpm
    # Pre-release tags (v1.4.0-rc51) go to testing, final tags (v1.4.2) to stable.
    - if [[ "${CI_COMMIT_REF_NAME#v}" == *-* ]]; then copr-cli build ndmspc/testing build/SRPMS/*.src.rpm --nowait; else copr-cli build ndmspc/stable build/SRPMS/*.src.rpm --nowait; fi
  only:
    - tags

# Builds the source tarball and publishes it to the package registry. `make dist` embeds
# the ndmspc-ui page (see NDMSPC_UI_EMBED), so the uploaded archive builds without
# network access; the release-source job links it from the tag's Release.
build-source:
  stage: deploy
  tags:
    - ndmspc-hosted
  image:
    name: $CI_REGISTRY/ndmspc/user/al10:dep
  script:
    - scripts/make.sh srpm
    # sed, not `head -n 1`: the runner uses `set -o pipefail`, and a reader that exits
    # early (head, grep -q) leaves ls/tar killed by SIGPIPE, failing the pipeline.
    - TARBALL=$(ls build/ndmspc-[0-9]*.tar.gz | sed -n '1p')
    - test -n "$TARBALL"
    - tar tzf "$TARBALL" > build/source-contents.txt
    - grep -q '/ui/ndmspc-ui-page.tar.gz' build/source-contents.txt || { echo "$TARBALL has no embedded ndmspc-ui page"; exit 1; }
    # The name says what it is: GitLab also lists the plain `git archive` as a source
    # archive on the Release, and the two are otherwise indistinguishable.
    - ASSET_NAME="ndmspc-${CI_COMMIT_TAG#v}-source-with-ui.tar.gz"
    - |
      curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$TARBALL" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ndmspc-source/${CI_COMMIT_TAG}/${ASSET_NAME}"
  only:
    - tags

# Links the tarball from build-source into the tag's Release:
#   $CI_PROJECT_URL/-/releases/<tag>/downloads/ndmspc-1.4.6-source-with-ui.tar.gz
# (GitLab's own "Download source code" is a plain `git archive` of the tag and cannot
# carry the page, so this is the archive to point people at.)
# The release is opened by hand when the notes are written, so an existing one keeps its
# notes and only gets the asset link (replaced if it is already there).
release-source:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - ndmspc-hosted
  needs:
    - build-source
  variables:
    GIT_STRATEGY: none # release is created via the API; no checkout needed
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GITLAB_HOST: "$CI_SERVER_HOST"
  script:
    - |
      set -eu
      test -n "${CI_COMMIT_TAG:-}" || { echo "release-source must run on a tag pipeline"; exit 1; }
      ASSET_NAME="ndmspc-${CI_COMMIT_TAG#v}-source-with-ui.tar.gz"
      ASSET_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ndmspc-source/${CI_COMMIT_TAG}/${ASSET_NAME}"
      if glab release view "$CI_COMMIT_TAG" --repo "$CI_PROJECT_PATH" >/dev/null 2>&1; then
        echo "Release $CI_COMMIT_TAG exists; keeping its notes and adding the source tarball"
        OLD_LINK_ID=$(glab api "projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links" |
          jq -r --arg n "$ASSET_NAME" '.[] | select(.name == $n) | .id' | sed -n '1p')
        if [ -n "$OLD_LINK_ID" ]; then
          echo "Replacing existing asset link $OLD_LINK_ID"
          glab api --method DELETE \
            "projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links/${OLD_LINK_ID}" >/dev/null
        fi
      else
        glab release create "$CI_COMMIT_TAG" \
          --repo "$CI_PROJECT_PATH" \
          --ref "$CI_COMMIT_SHA" \
          --name "NDMSPC $CI_COMMIT_TAG" \
          --notes "Source tarball with the ndmspc-ui page embedded: extracting and building it needs no network."
      fi
      glab api --method POST "projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links" \
        --raw-field "name=${ASSET_NAME}" \
        --raw-field "url=${ASSET_URL}" \
        --raw-field "direct_asset_path=/${ASSET_NAME}" \
        --raw-field "link_type=package"
  only:
    - tags

base-image:
  stage: deploy
  tags:
    - images
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # The build context has no .git (.dockerignore), so bake the version into VERSION.
    - scripts/write-version.sh
    - podman build $PODMAN_BUILD_OPTS -f ci/Dockerfile.base --tag $CI_REGISTRY_IMAGE/base:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE/base:$CI_COMMIT_REF_NAME --tag $CI_REGISTRY_IMAGE/base:latest --tag $CI_REGISTRY_IMAGE/base:next .
    - podman push $CI_REGISTRY_IMAGE/base:$CI_COMMIT_REF_NAME
    # - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then podman push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA; fi
    - if [[ "${CI_COMMIT_REF_NAME#v}" != *-* ]]; then podman push $CI_REGISTRY_IMAGE/base:latest; fi
    - if [[ "${CI_COMMIT_REF_NAME#v}" == *-* ]]; then podman push $CI_REGISTRY_IMAGE/base:next; fi
  allow_failure: true
  # when: manual
  only:
    - tags

# The Slurm worker (compute node) image: ndmspc + ROOT on AlmaLinux 10, built FROM
# the base image this project publishes, so it carries the same ndmspc release. It is
# the one Slurm image that has to exist here, and it is built and pushed automatically
# on every tag as $CI_REGISTRY_IMAGE/slurmd:<git tag>:
#   -e slurm_slurmd_image=$CI_REGISTRY_IMAGE/slurmd:<git tag>
#
# No other Slurm image is built here: deployments run the upstream Slinky images,
# which the devops project mirrors into registry.gitlab.com/ndmspc/devops.
#
# allow_failure keeps a failed publish from failing the tag.
slurm-worker-image:
  stage: deploy-slurm
  tags:
    - images
  variables:
    SLURM_TARGETS: "slurmd"
    # Slurm series the image must provide; the build fails when the COPR carries
    # something else (e.g. it still only ships 24.05).
    SLURM_SERIES: "26.05"
    # Ref of SlinkyProject/containers the supervisord/entrypoint files come from.
    SLINKY_REF: "main"
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      for target in $SLURM_TARGETS; do
        podman build \
          $PODMAN_BUILD_OPTS \
          --build-arg NDMSPC_BASE="$CI_REGISTRY_IMAGE/base:$CI_COMMIT_REF_NAME" \
          --build-arg SLURM_SERIES="$SLURM_SERIES" \
          --build-arg SLINKY_REF="$SLINKY_REF" \
          --target "$target" \
          --tag "$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_REF_NAME" \
          -f ci/Dockerfile.slurm .
      done
    - |
      for target in $SLURM_TARGETS; do
        podman push "$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_REF_NAME"
      done
    - |
      echo "Published the Slurm worker for $CI_COMMIT_REF_NAME:"
      for target in $SLURM_TARGETS; do
        echo "  $CI_REGISTRY_IMAGE/$target:$CI_COMMIT_REF_NAME"
      done
  allow_failure: true
  only:
    - tags

prod-image:
  stage: deploy-full
  tags:
    - images
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # MY_PROJECT_VER names the base image tag this image is built FROM (ci/Dockerfile),
    # it is not the build version.
    - podman build $PODMAN_BUILD_OPTS --build-arg MY_PROJECT_VER="${CI_COMMIT_REF_NAME#v}" -f ci/Dockerfile --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME --tag $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:next .
    - podman push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    # - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then podman push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA; fi
    - if [[ "${CI_COMMIT_REF_NAME#v}" != *-* ]]; then podman push $CI_REGISTRY_IMAGE:latest; fi
    - if [[ "${CI_COMMIT_REF_NAME#v}" == *-* ]]; then podman push $CI_REGISTRY_IMAGE:next; fi
  allow_failure: true
  # when: manual
  only:
    - tags

pages:
  image: registry.gitlab.com/ndmspc/user/fc44:dep
  stage: deploy
  # Publish the docs without waiting on the build stage: needs: [] starts this
  # job as soon as the pipeline is created, so a manual or failed build job
  # cannot leave it skipped.
  needs: []
  tags:
    - ndmspc-hosted
  script:
    - scripts/make.sh doc install
    - mv share/doc/ndmspc/html public
  artifacts:
    paths:
      - public
  only:
    - develop
