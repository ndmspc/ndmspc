# One pipeline per push. A branch with an open merge request would otherwise get
# two: a branch pipeline (push event) and a merge-request pipeline, because the
# catch-all `- when: on_success` in build-al9/build-al10 also matches
# merge_request_event. The branch pipeline is the merge gate here (see the note
# above build-al9), so merge-request pipelines are switched off entirely. Tags
# must stay allowed: they publish the base/slurmd/prod images.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - deploy
  - deploy-slurm
  - deploy-full

image: quay.io/podman/stable
variables:
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker
  DOCKER_DRIVER: overlay2
  PODMAN_BUILD_OPTS: "--memory 2g --cpu-period 100000 --cpu-quota 200000 --squash"
  MY_MAKE_JOBS: "2"

# These builds are the merge gate on feature branches. On the protected branches
# (main/develop) a merge only lands once the branch pipeline has already passed,
# so they would only repeat that work: they are left manual there, and optional,
# so the pipeline still reaches the deploy stage and `pages` runs without anyone
# having to click them. Tags only publish artifacts, so they never run.
build-al9:
  image: $CI_REGISTRY/ndmspc/user/al9:dep
  stage: build
  tags:
    - ndmspc-hosted
  script:
    - WITH_AI=false scripts/make.sh release test numcal
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == 'develop'"
      when: manual
      allow_failure: true
    - when: on_success

build-al10:
  image: $CI_REGISTRY/ndmspc/user/al10:dep
  stage: build
  tags:
    - ndmspc-hosted
  script:
    - scripts/make.sh release test
  allow_failure: true
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == 'develop'"
      when: manual
    - when: on_success

base-image-test:
  stage: build
  tags:
    - images
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - podman build $PODMAN_BUILD_OPTS -f ci/Dockerfile.base .
  allow_failure: true
  when: manual
  except:
    - tags
    - main
    - develop

build-rpm-copr:
  stage: deploy
  tags:
    - ndmspc-hosted
  image:
    name: $CI_REGISTRY/ndmspc/user/al10:dep
  script:
    - export COPR_LOGIN COPR_TOKEN COPR_USER
    - scripts/copr.sh $COPR_DEBUG
    - export MY_PROJECT_VER=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f1)
    - export MY_PROJECT_VER_RELEASE=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f2)
    - scripts/make.sh rpm
    - if [ -z "$MY_PROJECT_VER_RELEASE" ];then copr-cli build ndmspc/stable build/SRPMS/*.src.rpm --nowait; fi
    - if [ -n "$MY_PROJECT_VER_RELEASE" ];then copr-cli build ndmspc/testing build/SRPMS/*.src.rpm --nowait; fi
  only:
    - tags

base-image:
  stage: deploy
  tags:
    - images
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export MY_PROJECT_VER=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f1)
    - export MY_PROJECT_VER_RELEASE=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f2)
    - podman build $PODMAN_BUILD_OPTS --build-arg MY_PROJECT_VER="$MY_PROJECT_VER" -f ci/Dockerfile.base --tag $CI_REGISTRY_IMAGE/base:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE/base:$CI_COMMIT_REF_NAME --tag $CI_REGISTRY_IMAGE/base:latest --tag $CI_REGISTRY_IMAGE/base:next .
    - podman push $CI_REGISTRY_IMAGE/base:$CI_COMMIT_REF_NAME
    # - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then podman push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA; fi
    - if [ -z "$MY_PROJECT_VER_RELEASE" ];then podman push $CI_REGISTRY_IMAGE/base:latest; fi
    - if [ -n "$MY_PROJECT_VER_RELEASE" ];then podman push $CI_REGISTRY_IMAGE/base:next; fi
  allow_failure: true
  # when: manual
  only:
    - tags

# The Slurm worker (compute node) image: ndmspc + ROOT on AlmaLinux 10, built FROM
# the base image this project publishes, so it carries the same ndmspc release. It is
# the one Slurm image that has to exist here, and it is built and pushed automatically
# on every tag as $CI_REGISTRY_IMAGE/slurmd:<git tag>:
#   -e slurm_slurmd_image=$CI_REGISTRY_IMAGE/slurmd:<git tag>
#
# No other Slurm image is built here: deployments run the upstream Slinky images,
# which the devops project mirrors into registry.gitlab.com/ndmspc/devops.
#
# allow_failure keeps a failed publish from failing the tag.
slurm-worker-image:
  stage: deploy-slurm
  tags:
    - images
  variables:
    SLURM_TARGETS: "slurmd"
    # Slurm series the image must provide; the build fails when the COPR carries
    # something else (e.g. it still only ships 24.05).
    SLURM_SERIES: "26.05"
    # Ref of SlinkyProject/containers the supervisord/entrypoint files come from.
    SLINKY_REF: "main"
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      for target in $SLURM_TARGETS; do
        podman build \
          $PODMAN_BUILD_OPTS \
          --build-arg NDMSPC_BASE="$CI_REGISTRY_IMAGE/base:$CI_COMMIT_REF_NAME" \
          --build-arg SLURM_SERIES="$SLURM_SERIES" \
          --build-arg SLINKY_REF="$SLINKY_REF" \
          --target "$target" \
          --tag "$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_REF_NAME" \
          -f ci/Dockerfile.slurm .
      done
    - |
      for target in $SLURM_TARGETS; do
        podman push "$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_REF_NAME"
      done
    - |
      echo "Published the Slurm worker for $CI_COMMIT_REF_NAME:"
      for target in $SLURM_TARGETS; do
        echo "  $CI_REGISTRY_IMAGE/$target:$CI_COMMIT_REF_NAME"
      done
  allow_failure: true
  only:
    - tags

prod-image:
  stage: deploy-full
  tags:
    - images
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export MY_PROJECT_VER=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f1)
    - export MY_PROJECT_VER_RELEASE=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f2)
    - podman build $PODMAN_BUILD_OPTS --build-arg MY_PROJECT_VER="${CI_COMMIT_REF_NAME/v/}" -f ci/Dockerfile --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME --tag $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:next .
    - podman push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    # - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then podman push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA; fi
    - if [ -z "$MY_PROJECT_VER_RELEASE" ];then podman push $CI_REGISTRY_IMAGE:latest; fi
    - if [ -n "$MY_PROJECT_VER_RELEASE" ];then podman push $CI_REGISTRY_IMAGE:next; fi
  allow_failure: true
  # when: manual
  only:
    - tags

pages:
  image: registry.gitlab.com/ndmspc/user/fc44:dep
  stage: deploy
  # Publish the docs without waiting on the build stage: needs: [] starts this
  # job as soon as the pipeline is created, so a manual or failed build job
  # cannot leave it skipped.
  needs: []
  tags:
    - ndmspc-hosted
  script:
    - scripts/make.sh doc install
    - mv share/doc/ndmspc/html public
  artifacts:
    paths:
      - public
  only:
    - develop
